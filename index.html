<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>☯️ Kimi</title>
    <style>
        /* (All previous styles remain the same) */
        :root {
            --bg: #ffffff; --bg-rgb: 255, 255, 255; --text: #000000;
            --primary: #6c63ff; --user-bubble: #6c63ff; --ai-bubble: transparent;
            --code-bg: #f4f4f4;
        }
        @media (prefers-color-scheme: dark) {
            :root { --bg: #000000; --bg-rgb: 0, 0, 0; --text: #ffffff; --code-bg: #1f1f1f; }
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system; background: var(--bg); color: var(--text); overflow: hidden; }
        .container { display: flex; flex-direction: column; height: 100vh; padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
        .header { flex-shrink: 0; padding: 12px 16px; text-align: center; backdrop-filter: blur(20px); background: rgba(var(--bg-rgb), 0.8); }
        .chat-area { flex: 1; overflow-y: auto; padding: 16px; }
        .message { margin-bottom: 16px; display: flex; flex-direction: column; }
        .message.user { align-items: flex-end; }
        .message.ai { align-items: flex-start; }
        .message-bubble { padding: 10px 14px; border-radius: 18px; max-width: 75%; word-wrap: break-word; white-space: pre-wrap; }
        .message.user .message-bubble { background: var(--user-bubble); color: white; }
        .message.ai .message-bubble { background: var(--ai-bubble); color: var(--text); padding: 0; }
        .input-area { flex-shrink: 0; padding: 12px 16px; backdrop-filter: blur(30px); background: rgba(var(--bg-rgb), 0.85); border-top: 1px solid rgba(var(--border-rgb), 0.3); }
        .input-wrapper { display: flex; align-items: flex-end; gap: 8px; }
        .input-field { flex: 1; padding: 10px 14px; border: 1px solid rgba(var(--border-rgb), 0.3); border-radius: 20px; font-size: 16px; background: rgba(var(--bg-rgb), 0.5); color: var(--text); outline: none; }
        .send-btn { width: 36px; height: 36px; border-radius: 50%; border: none; background: var(--primary); color: white; display: flex; align-items: center; justify-content: center; cursor: pointer; }
        .send-btn:disabled { opacity: 0.5; }
        .code-block { background: var(--code-bg); border-radius: 8px; padding: 12px; margin: 8px 0; overflow-x: auto; }
        .code-block pre { margin: 0; font-family: 'SF Mono', Monaco, monospace; font-size: 13px; }
        .status { text-align: center; padding: 8px; font-size: 14px; color: var(--text-secondary); }
        .retry-btn { background: var(--primary); color: white; border: none; padding: 8px 16px; border-radius: 8px; margin-left: 10px; cursor: pointer; }
        .hidden { display: none; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">☯️ Kimi Free</div>
        <div class="chat-area" id="chat"></div>
        <div class="input-area">
            <div class="input-wrapper">
                <textarea class="input-field" id="input" placeholder="Message Kimi..." rows="1"></textarea>
                <button class="send-btn" id="send" disabled>Send</button>
            </div>
            <div class="status" id="status">
                <span id="status-text">Initializing Puter...</span>
                <button class="retry-btn hidden" id="retry-btn">Retry</button>
            </div>
        </div>
    </div>

    <script src="https://js.puter.com/v2/"></script>
    <script>
        const FREE_MODEL = 'moonshotai/kimi-k2:free';
        const chat = document.getElementById('chat');
        const input = document.getElementById('input');
        const send = document.getElementById('send');
        const statusText = document.getElementById('status-text');
        const retryBtn = document.getElementById('retry-btn');
        
        let isInitialized = false;
        let initFailed = false;

        // ----------------------------------------
        // ROBUST INITIALIZATION WITH TIMEOUT
        // ----------------------------------------
        async function initPuter() {
            const timeoutPromise = new Promise((_, reject) => 
                setTimeout(() => reject(new Error('Timeout after 5s')), 5000)
            );

            try {
                statusText.textContent = 'Initializing Puter session...';
                
                // Race between Puter init and timeout
                await Promise.race([
                    puter.auth.signIn({ 
                        attempt_temp_user_creation: true,
                        show_dialog: false 
                    }),
                    timeoutPromise
                ]);
                
                statusText.textContent = '✅ Puter ready';
                isInitialized = true;
                send.disabled = false;
                retryBtn.classList.add('hidden');
                
            } catch (error) {
                console.error('Init failed:', error);
                
                // Even if init fails, allow using the app
                statusText.textContent = '⚠️ Using limited mode';
                isInitialized = true; // Allow sending anyway
                send.disabled = false;
                
                // Show retry button if user wants to try again
                retryBtn.textContent = 'Retry';
                retryBtn.classList.remove('hidden');
            }
        }

        // Retry button
        retryBtn.addEventListener('click', () => {
            retryBtn.classList.add('hidden');
            initPuter();
        });

        // Start initialization
        initPuter();

        // ----------------------------------------
        // SEND MESSAGE (works even if init failed)
        // ----------------------------------------
        async function sendMessage() {
            const message = input.value.trim();
            if (!message) return;

            // Add user message
            chat.innerHTML += `<div class="message user"><div class="message-bubble">${message}</div></div>`;
            
            // Add AI container
            const aiDiv = document.createElement('div');
            aiDiv.className = 'message ai';
            chat.appendChild(aiDiv);

            // Disable input
            input.disabled = true;
            send.disabled = true;
            statusText.textContent = 'Calling Kimi...';

            try {
                const response = await puter.ai.chat(message, {
                    model: FREE_MODEL,
                    stream: true
                });

                statusText.textContent = 'Generating...';

                let fullResponse = '';
                for await (const part of response) {
                    if (part?.text) {
                        fullResponse += part.text;
                        aiDiv.innerHTML = `<div class="message-bubble">${fullResponse}</div>`;
                        chat.scrollTop = chat.scrollHeight;
                    }
                }

                statusText.textContent = '✅ Success';
            } catch (error) {
                console.error('Error:', error);
                aiDiv.innerHTML = `<div class="message-bubble" style="color: red;">❌ Error: ${error.message}</div>`;
                statusText.textContent = 'Check console';
            } finally {
                input.disabled = false;
                send.disabled = false;
                input.value = '';
                chat.scrollTop = chat.scrollHeight;
            }
        }

        // Event listeners
        send.addEventListener('click', sendMessage);
        input.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });
    </script>
</body>
</html>
