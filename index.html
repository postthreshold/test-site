<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Kimi Free Test</title>
</head>
<body>
<h1>Testing Kimi Free</h1>
<button id="test">Send Test Message</button>
<div id="result"></div>

<script src="https://js.puter.com/v2/"></script>
<script>
// Initialize Puter BEFORE button is clicked
(async function init() {
    try {
        await puter.auth.signIn({ attempt_temp_user_creation: true, show_dialog: false });
        console.log('Puter ready');
    } catch (e) {
        console.log('Init failed, continuing...');
    }
})();

document.getElementById('test').addEventListener('click', async () => {
    try {
        const response = await puter.ai.chat("Hello, testing free model", {
            model: 'moonshotai/kimi-k2:free'
        });
        document.getElementById('result').innerHTML = `<p>✅ Success: ${response.text}</p>`;
    } catch (error) {
        document.getElementById('result').innerHTML = `<p>❌ Error: ${error.message}</p>`;
    }
});
</script>
</body>
</html>
